<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=index.html">
  <title>UNCOVER — Redirecting to Search</title>
  <script>
    // Forward URL parameters (e.g. ?query=... or ?demo=...) to index.html or workspace.html
    const params = window.location.search;
    if (params && params.includes('query=')) {
      window.location.replace('workspace.html' + params);
    } else {
      window.location.replace('index.html' + params);
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px; color: #654332;">
  <p>Redirecting to UNCOVER Research Search...</p>
  <a href="index.html">Click here if not redirected automatically</a>
</body>
</html>
