<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNCOVER — Research Report Dossier</title>
  <meta name="description" content="Evidence-backed intelligence report with verified claims, conflicting perspectives, and authoritative citations.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Editorial & Academic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* Academic Report Document Styling */
    .report-page-body {
      background-color: var(--color-cream-ivory);
      color: var(--color-brown-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .report-doc-container {
      max-width: 860px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-4) var(--space-20);
      flex: 1;
      width: 100%;
    }

    /* Top Action Bar (Non-Printable) */
    .report-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      margin-bottom: var(--space-8);
      border-bottom: 1px solid var(--color-brown-border);
    }

    .report-action-buttons {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    /* Academic Paper Card Layout */
    .report-paper {
      background: #FFFFFF;
      border: 1px solid var(--color-brown-border);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 48px);
      box-shadow: 0 4px 20px rgba(56, 37, 30, 0.05);
    }

    .report-header-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-4);
      border-bottom: 1.5px solid var(--color-brown-border);
    }

    .report-main-title {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 800;
      color: var(--color-brown-dark);
      line-height: 1.25;
      margin-bottom: var(--space-3);
    }

    .report-inquiry-sub {
      font-size: var(--text-sm);
      color: var(--color-brown-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-6);
    }

    /* Metrics Summary Bar */
    .report-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: var(--space-3);
      background: var(--color-cream-subtle);
      border: 1px solid var(--color-brown-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-8);
      text-align: center;
    }

    .report-stat-num {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--color-brown-dark);
      line-height: 1.1;
    }

    .report-stat-label {
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-brown-secondary);
      margin-top: 4px;
    }

    /* Report Article Sections */
    .report-section {
      margin-bottom: var(--space-10);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .report-section-title {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-brown-dark);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding-bottom: var(--space-2);
      border-bottom: 1.5px solid rgba(101, 67, 50, 0.18);
      margin-bottom: var(--space-4);
    }

    .report-section-title .section-idx {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--color-brown-primary);
      background: var(--color-cream-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--color-brown-border);
    }

    .report-p {
      font-size: var(--text-sm);
      line-height: 1.75;
      color: var(--color-brown-dark);
      margin-bottom: var(--space-3);
    }

    /* Key Findings List */
    .finding-item {
      background: var(--color-cream-subtle);
      border-left: 3px solid var(--color-brown-primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-3);
      font-size: var(--text-sm);
      line-height: 1.6;
    }

    /* Claim Verification Card */
    .claim-item-card {
      background: #FFFFFF;
      border: 1px solid var(--color-brown-border);
      border-radius: var(--radius-sm);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
    }

    .claim-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .claim-statement {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-brown-dark);
      margin-bottom: var(--space-2);
      line-height: 1.45;
    }

    .claim-rationale {
      font-size: var(--text-xs);
      color: var(--color-brown-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-2);
    }

    .claim-quote-box {
      font-size: 11.5px;
      font-style: italic;
      color: var(--color-brown-primary);
      background: var(--color-cream-subtle);
      border-left: 2px solid var(--color-blue-deep);
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin-top: 6px;
    }

    /* Conflict Box */
    .conflict-item-card {
      background: var(--color-cream-subtle);
      border: 1px solid var(--color-brown-border);
      border-radius: var(--radius-sm);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .conflict-positions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-3);
      margin: var(--space-3) 0;
    }

    .conflict-pos-box {
      background: #FFFFFF;
      border: 1px solid var(--color-brown-border);
      border-radius: var(--radius-xs);
      padding: var(--space-3);
    }

    /* References Table / List */
    .reference-row {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) 0;
      border-bottom: 1px solid rgba(101, 67, 50, 0.1);
      font-size: var(--text-xs);
    }

    .reference-key {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--color-brown-primary);
      flex-shrink: 0;
      width: 28px;
    }

    .reference-main {
      flex: 1;
    }

    .reference-link {
      font-weight: 700;
      color: var(--color-brown-dark);
      text-decoration: underline;
      line-height: 1.4;
      display: inline-block;
      margin-bottom: 2px;
    }

    .reference-link:hover {
      color: var(--color-blue-deep);
    }

    .reference-meta {
      color: var(--color-brown-secondary);
      font-size: 11px;
      margin-bottom: 2px;
    }

    .reference-snippet {
      color: var(--color-brown-light);
      font-style: italic;
      font-size: 11px;
      line-height: 1.4;
    }

    /* PRINT SPECIFIC STYLES */
    @media print {
      .site-header,
      .report-actions-bar,
      .site-footer,
      #toastContainer {
        display: none !important;
      }

      body {
        background: #FFFFFF !important;
        color: #000000 !important;
      }

      .report-doc-container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .report-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }

      a {
        text-decoration: none !important;
        color: #000000 !important;
      }

      .report-section {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body class="report-page-body">

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-link" aria-label="UNCOVER Home">
        <img src="assets/logo.svg" alt="UNCOVER Logo" class="brand-logo-img">
        <span style="font-family: var(--font-heading); font-weight: 800; font-size: var(--text-lg); color: var(--color-brown-dark); margin-left: 8px;">UNCOVER</span>
      </a>

      <div class="nav-cta-group">
        <a href="history.html" class="btn btn-outline btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
        <a href="index.html" class="btn btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          New Search
        </a>
      </div>
    </div>
  </header>

  <!-- Document Canvas -->
  <main class="report-doc-container">

    <!-- Non-Printable Actions Bar -->
    <div class="report-actions-bar">
      <div class="flex items-center gap-2">
        <a href="index.html" class="btn btn-outline btn-sm">
          &larr; Back to Search
        </a>
        <span id="savedIndicatorBadge" class="badge badge-brown" style="font-size: 11px;">
          ✓ Saved in History
        </span>
      </div>

      <div class="report-action-buttons">
        <button id="copyReportBtn" class="btn btn-secondary btn-sm" title="Copy full report as formatted text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy Report
        </button>
        <button id="printReportBtn" class="btn btn-outline btn-sm" title="Print or save as PDF">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Print / PDF
        </button>
      </div>
    </div>

    <!-- Printable Paper Article -->
    <article class="report-paper" id="reportContentArea">
      <div style="text-align: center; padding: 40px; color: var(--color-brown-secondary);">
        Loading report dossier...
      </div>
    </article>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 UNCOVER Research Systems &middot; PromptWars X Agent X 2.0 (PS03)</div>
      <div>60% Brown &middot; 30% Cream &middot; 10% Baby Blue</div>
    </div>
  </footer>

  <!-- Report Renderer & Action Controller Script -->
  <script type="module" src="js/report.js"></script>
</body>
</html>
